# ============================================================================
# KB Curator — license-vetted ALLOWLIST (NOT open-web crawling)
#
# This is a hand-picked list of upstream sources we are legally + editorially
# comfortable summarizing into the knowledge base. The curator NEVER crawls the
# open web; it only polls the entries below. Prune freely — fewer, trusted
# sources beats broad coverage.
#
# Each entry:
#   id        stable id (also the kb_sources primary key + dedupe key)
#   type      github | rss | arxiv | sitemap
#   url       the polled endpoint (releases atom feed / RSS / arXiv query / sitemap)
#   repo      owner/name (github only) — for release provenance
#   license   the VETTED upstream license (drives the IP gate; never guess)
#   fetch     auto (plain fetch → playwright → firecrawl as configured)
#   category  KB bucket — MUST match a kb/ folder + documents.category value:
#               Agent frameworks · Durable execution / orchestration ·
#               Tool use / MCP · Vector DBs and clients · RAG tooling ·
#               Deployment & serving / gateways · Evaluation & observability ·
#               Guardrails & security · Providers & models · Foundations ·
#               Prompting & context · Memory · Training & adaptation
#
# Licensing notes:
#   - GitHub release NOTES are factual changelogs; we summarize, never copy
#     verbatim, and attribute to the repo+tag. License recorded is the repo's.
#   - arXiv abstracts are summarized under fair-use; many papers are CC-BY but we
#     do not assume it — we record "arXiv-abstract" and keep only our summary.
#   - Vendor blogs/docs are summarized + linked; recorded as "official-docs".
# ============================================================================

